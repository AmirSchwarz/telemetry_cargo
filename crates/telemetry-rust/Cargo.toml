[package]
name = "telemetry-rust"
description = "Privacy-first telemetry SDK for applications, with a shared Rust engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "telemetry"

[features]
default = ["http", "sqlite", "tracing"]
http = ["telemetry-core/http"]
sqlite = ["telemetry-core/sqlite"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
telemetry-core.workspace = true
telemetry-schema.workspace = true
telemetry-privacy.workspace = true
telemetry-platform.workspace = true
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
telemetry-transport = { workspace = true, features = ["http"] }
